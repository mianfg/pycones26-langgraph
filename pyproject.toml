[project]
name = "pycones26-langgraph"
version = "1.0.0"
description = "Taller PyConES 2026 — Introducción a LangGraph: construyendo agentes que aprenden"
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "Miguel Ángel Fernández Gutiérrez" }]
dependencies = [
    # Núcleo del taller
    "langgraph>=1.2.19",
    "langchain>=1.4.8",
    "langchain-core>=1.7.4",
    "langgraph-checkpoint-sqlite>=3.1.3",
    "langgraph-sdk>=0.4.12",
    "pydantic>=2.12",
    "httpx>=0.28",
    # Proveedores de modelos (elige uno en .env)
    "langchain-openai>=1.7.2",
    "langchain-anthropic>=1.7.6",
    "langchain-google-genai>=4.4.2",
    "langchain-ollama>=1.1.0",
    # Utilidades
    "numpy>=2.5.4",
    "python-dotenv>=1.2.4",
    # Notebooks
    "jupyterlab>=4.6.4",
    "ipykernel>=7.4.0",
    # Trazas (opcional en el taller; ver taller/observabilidad.py)
    "langfuse>=5.1.0",
]

[dependency-groups]
dev = [
    "nbclient>=0.11.0",
    "nbformat>=5.11.0",
    "jupytext>=1.19.6",
    "pytest>=9.0.0",
    "langgraph-cli[inmem]>=0.4.40",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning:langsmith"]

[project.scripts]
# `uv run studio` = `uv run langgraph dev --studio-url https://eu.smith.langchain.com` (ver taller/cli.py)
studio = "taller.cli:studio"

[build-system]
requires = ["uv_build>=0.13.5,<0.14"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = ""
module-name = "taller"
# extras/ se instala en la raíz del .venv (etc/jupyter y share/jupyter): JupyterLab muestra los
# ficheros ocultos, para poder abrir y editar .env desde el propio JupyterLab.
data = { data = "extras" }
